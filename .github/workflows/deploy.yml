name: deploy

# Publishes the redirect pages to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect the pages
        run: |
          mkdir _site
          cp index.html 404.html .nojekyll _site/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
